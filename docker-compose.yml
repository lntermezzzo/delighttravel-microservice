services:
  core-service:
    build: ./core-service
    container_name: delighttravel-core
    restart: unless-stopped
    env_file: .env          # rahasia, jangan di-commit ke GitHub
    mem_limit: 256m          # jaga STB tidak hang
    cpus: 0.5
    volumes:
      - ./core-service/data:/app/data

  gateway:
    image: nginx:1.28-alpine
    container_name: delighttravel-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    mem_limit: 64m
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-service

# Catatan: tunnel TIDAK dijalankan lewat compose ini.
# Akses publik https://sabeb.stei.fun ditangani oleh cloudflared
# yang di-install sebagai service NATIVE di host STB (via apt),
# bukan container Docker -- token dikelola asisten, lihat README.md.
